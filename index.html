    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@600;800&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">

    <style>
        /* Primary Educational Japanese Font Stack with textbook stroke fallbacks */
        body {
            font-family: 'UD デジタル 教科書体 N-R', 'UD Digi Kyokasho N-R', 'Klee One', 'Zen Maru Gothic', sans-serif;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
            background-color: #f0fdf4;
        }

        .font-educational {
            font-family: 'UD デジタル 教科書体 N-R', 'UD Digi Kyokasho N-R', 'Klee One', 'Zen Maru Gothic', sans-serif;
            font-weight: 800;
        }

        /* Tactile button tactile depth and touch feedback */
        .btn-touch {
            transition: transform 0.1s ease, box-shadow 0.1s ease, background-color 0.15s ease;
            box-shadow: 0 8px 0 0 rgba(0, 0, 0, 0.15);
        }
        .btn-touch:active {
            transform: translateY(5px);
            box-shadow: 0 3px 0 0 rgba(0, 0, 0, 0.15);
        }

        /* Row Selection Card Styling */
        .btn-card {
            transition: all 0.2s ease;
            box-shadow: 0 8px 0 0 rgba(16, 185, 129, 0.2);
        }
        .btn-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 0 0 rgba(16, 185, 129, 0.25);
        }
        .btn-card:active {
            transform: translateY(4px);
            box-shadow: 0 4px 0 0 rgba(16, 185, 129, 0.2);
        }

        /* Confetti Fullscreen Overlay */
        #confettiCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 50;
        }

        /* Friendly Pulse Animation */
        @keyframes soundPulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.04); }
            100% { transform: scale(1); }
        }
        .animate-sound {
            animation: soundPulse 2s infinite ease-in-out;
        }

        /* Subtle Shake for Gentle Mistake Indication */
        @keyframes gentleShake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }
        .animate-shake {
            animation: gentleShake 0.4s ease-in-out;
        }
    </style>

        // Web Audio API Synthesizer for cheerful, zero-latency sound effects
        const AudioEngine = {
            ctx: null,
            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    if (AudioContext) this.ctx = new AudioContext();
                }
            },
            playCorrect() {
                try {
                    this.init();
                    if (!this.ctx) return;
                    const now = this.ctx.currentTime;
                    const freqs = [523.25, 659.25, 783.99]; // Bright C5 -> E5 -> G5 chime
                    freqs.forEach((freq, idx) => {
                        const osc = this.ctx.createOscillator();
                        const gain = this.ctx.createGain();
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(freq, now + idx * 0.09);
                        gain.gain.setValueAtTime(0.3, now + idx * 0.09);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.09 + 0.28);
                        osc.connect(gain);
                        gain.connect(this.ctx.destination);
                        osc.start(now + idx * 0.09);
                        osc.stop(now + idx * 0.09 + 0.28);
                    });
                } catch(e) {}
            },
            playTryAgain() {
                try {
                    this.init();
                    if (!this.ctx) return;
                    const now = this.ctx.currentTime;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(240, now);
                    osc.frequency.exponentialRampToValueAtTime(180, now + 0.22);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.22);
                } catch(e) {}
            },
            playFanfare() {
                try {
                    this.init();
                    if (!this.ctx) return;
                    const now = this.ctx.currentTime;
                    const notes = [523.25, 659.25, 783.99, 1046.50]; // Victory fanfare
                    notes.forEach((freq, idx) => {
                        const osc = this.ctx.createOscillator();
                        const gain = this.ctx.createGain();
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(freq, now + idx * 0.12);
                        gain.gain.setValueAtTime(0.35, now + idx * 0.12);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.12 + 0.45);
                        osc.connect(gain);
                        gain.connect(this.ctx.destination);
                        osc.start(now + idx * 0.12);
                        osc.stop(now + idx * 0.12 + 0.45);
                    });
                } catch(e) {}
            }

        function getSVGGraphic(key) {
            return SVG_GRAPHICS[key] || `<svg class="w-20 h-20 md:w-28 md:h-28 text-yellow-400" viewBox="0 0 64 64" fill="currentColor"><polygon points="32,8 39,24 56,25 43,36 47,53 32,44 17,53 21,36 8,25 25,24"/></svg>`;
        }

        let confettiParticles = [];
        let confettiAnimId = null;

        function triggerConfetti() {
            const canvas = document.getElementById('confettiCanvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            confettiParticles = [];
            const colors = ['#f43f5e', '#10b981', '#06b6d4', '#f59e0b', '#8b5cf6', '#ec4899'];
            
            for (let i = 0; i < 75; i++) {
                confettiParticles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height * 0.3 - canvas.height * 0.1,
                    size: Math.random() * 12 + 6,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    speedX: (Math.random() - 0.5) * 6,
                    speedY: Math.random() * 5 + 4,
                    rotation: Math.random() * 360,
                    rotSpeed: (Math.random() - 0.5) * 10
                });
            }

            if (confettiAnimId) cancelAnimationFrame(confettiAnimId);
            animateConfetti(ctx, canvas);
        }

        function animateConfetti(ctx, canvas) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            let activeParticles = 0;

            confettiParticles.forEach(p => {
                p.x += p.speedX;
                p.y += p.speedY;
                p.rotation += p.rotSpeed;

                if (p.y < canvas.height + 20) {
                    activeParticles++;
                    ctx.save();
                    ctx.translate(p.x, p.y);
                    ctx.rotate((p.rotation * Math.PI) / 180);
                    ctx.fillStyle = p.color;
                    ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
                    ctx.restore();
                }
            });

            if (activeParticles > 0) {
                confettiAnimId = requestAnimationFrame(() => animateConfetti(ctx, canvas));
            } else {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            }
        }

        function formatTextForSpeech(text) {
            if (!text) return "";
            return text
                .replace(/『は』/g, "『ハ』")
                .replace(/「は」/g, "「ハ」")
                .replace(/『へ』/g, "『ヘ』")
                .replace(/「へ」/g, "「ヘ」")
                .replace(/はなまる/g, "ハナマル");
        }

        function speakText(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const formattedText = formatTextForSpeech(text);
                const utterance = new SpeechSynthesisUtterance(formattedText);
                utterance.lang = 'ja-JP';
                utterance.rate = 0.85; // Natural slow speed for children
                utterance.pitch = 1.1;
                window.speechSynthesis.speak(utterance);
            }
        }

        function speakCurrentPrompt() {
            if (currentQuestions.length === 0) return;
            const q = currentQuestions[currentIndex];
            const textToSpeak = q.speechPrompt || formatTextForSpeech(q.audioPrompt);
            speakText(textToSpeak);
        }

        function renderRowGrid() {

            grid.innerHTML = '';

                    ${isCleared 
                        ? `<div class="w-full bg-${row.color}-100 text-${row.color}-800 font-black text-xs md:text-sm py-1 rounded-xl">💮 クリア！</div>`

        function shuffleOptions(correctChar, dummyChar) {
            const arr = [correctChar, dummyChar];
            return Math.random() < 0.5 ? arr : [dummyChar, correctChar];
        }

        function startRow(rowKey) {
            currentRowKey = rowKey;
            const rowData = GOJUON_DATA[rowKey];
            
            currentQuestions = [];

            // CRITICAL REQUIREMENT: For EVERY character in the row, generate questions in EXACT 3-step order:
            // Step 1: 「おなじ もじを えらぼう！」
            // Step 2: 「『〇』の おとは どちらかな？」
            // Step 3: 「『〇〇〇』の『〇』は どちらかな？」
            rowData.chars.forEach((char) => {
                const illus = rowData.illustrations[char] || { key: "hoshi", label: char };
                const dummy = DUMMY_MAP[char] || "く";

                // Step 1: Visual Matching ("おなじ もじを えらぼう！")
                currentQuestions.push({
                    stepNumber: 1,
                    char: char,
                    dummy: dummy,
                    instruction: "おなじ もじを えらぼう！",
                    audioPrompt: "おなじ もじを えらぼう！",
                    display: `<div class="w-28 h-28 md:w-36 md:h-36 bg-emerald-100 rounded-3xl border-4 border-emerald-400 flex items-center justify-center font-educational text-6xl md:text-8xl text-emerald-900 shadow-inner">
                        ${char}
                    </div>`
                });

                // Step 2: Audio Matching ("『〇』の おとは どちらかな？")
                currentQuestions.push({
                    stepNumber: 2,
                    char: char,
                    dummy: dummy,
                    instruction: `『${char}』の おとは どちらかな？`,
                    audioPrompt: `『${char}』の おとは どちらかな？`,
                    speechPrompt: `『${char}』の おとは どちらかな？`,
                    display: `<button onclick="speakText('${char}')" class="btn-touch flex flex-col items-center gap-2 p-4 md:p-6 bg-amber-100 hover:bg-amber-200 rounded-3xl border-4 border-amber-400 shadow-md cursor-pointer">
                        ${getSVGGraphic('sound')}
                        <span class="font-educational text-lg md:text-2xl font-black text-amber-900">🔊 ここを おして おとを きく</span>
                    </button>`
                });

                // Step 3: Context / Word Matching ("『〇〇〇』の『〇』は どちらかな？")
                let wordInst = `『${illus.label}』の 『${char}』は どちらかな？`;
                let wordAudio = `${illus.label} の 『${char}』は どちらかな？`;
                if (illus.customInstruction) {
                    wordInst = illus.customInstruction;
                    wordAudio = illus.customAudio || illus.customInstruction;
                }

                currentQuestions.push({
                    stepNumber: 3,
                    char: char,
                    dummy: dummy,
                    instruction: wordInst,
                    audioPrompt: wordAudio,
                    display: `<div class="flex flex-col items-center gap-2">
                        ${getSVGGraphic(illus.key)}
                        <span class="font-educational text-2xl md:text-3xl font-black text-emerald-800 bg-emerald-100 px-5 py-1.5 rounded-2xl border-2 border-emerald-300 shadow-sm">${illus.label}</span>
                    </div>`
                });
            });

            currentIndex = 0;

            // UI Mode Switch
            document.getElementById('rowSelectScreen').classList.add('hidden');
            document.getElementById('quizScreen').classList.remove('hidden');
            document.getElementById('homeBtn').classList.remove('hidden');
            document.getElementById('speakerBtn').classList.remove('hidden');
            document.getElementById('qCountBadge').classList.remove('hidden');

            const badge = document.getElementById('stepBadge');
            badge.textContent = `${rowData.name} チャレンジ`;
            badge.className = `font-educational bg-${rowData.color}-500 text-white font-black text-sm md:text-xl px-3 py-1.5 md:px-4 md:py-1.5 rounded-full shadow`;

            renderQuestion();
        }

        function renderQuestion() {
            if (currentIndex >= currentQuestions.length) {
                completeCurrentRow();
                return;
            }

            isProcessing = false;
            const q = currentQuestions[currentIndex];

            // Counter Badges & Step Badges
            document.getElementById('qCountBadge').textContent = `だい ${currentIndex + 1} / ${currentQuestions.length} もん`;
            
            document.getElementById('charProgressText').textContent = `「${q.char}」の もんだい`;
            
            const stepNames = {
                1: "ステップ 1 / 3： おなじ もじ",
                2: "ステップ 2 / 3： おとを きく",
                3: "ステップ 3 / 3： ことばと もじ"
            };
            document.getElementById('stepTypeBadge').textContent = stepNames[q.stepNumber] || "";

            // Instructions & Display Graphic
            document.getElementById('instructionText').textContent = q.instruction;
            document.getElementById('sampleDisplay').innerHTML = q.display;

            // Randomize Left/Right options positioning
            currentOptions = shuffleOptions(q.char, q.dummy);

            const optA = document.getElementById('optA');
            const optB = document.getElementById('optB');

            optA.textContent = currentOptions[0];
            optB.textContent = currentOptions[1];

            // Play Step 2 target audio automatically when step 2 appears, or speak prompt for step 1 & 3
            if (q.stepNumber === 2) {
                speakText(`『${q.char}』の おとは どちらかな？`);
            } else {
                speakCurrentPrompt();
            }
        }

        function checkAnswer(chosenIndex) {
            if (isProcessing) return;
            isProcessing = true;

            const q = currentQuestions[currentIndex];
            const selectedChar = currentOptions[chosenIndex];
            const isCorrect = selectedChar === q.char;

            const modal = document.getElementById('feedbackModal');
            const icon = document.getElementById('feedbackIcon');
            const title = document.getElementById('feedbackTitle');
            const msg = document.getElementById('feedbackMessage');

            modal.classList.remove('hidden');
            modal.classList.add('flex');

            if (isCorrect) {
                AudioEngine.playCorrect();
                triggerConfetti();

                icon.textContent = "⭕";
                title.textContent = "オッケー！💮";
                title.className = "font-educational text-4xl md:text-5xl font-black text-emerald-600";
                msg.textContent = `「${q.char}」で だいせいかい！`;

                // Robust, short, crisp audio response ("オッケー！") so SpeechSynthesis never clips!
                speakText("オッケー！");

                setTimeout(() => {
                    modal.classList.add('hidden');
                    modal.classList.remove('flex');
                    currentIndex++;
                    renderQuestion();
                }, 1100);
            } else {
                AudioEngine.playTryAgain();

                icon.textContent = "❌";
                title.textContent = "おしい！";
                title.className = "font-educational text-4xl md:text-5xl font-black text-rose-500";
                msg.textContent = "もういちど やってみよう！";

                const card = document.getElementById('promptCard');
                card.classList.add('animate-shake');
                setTimeout(() => card.classList.remove('animate-shake'), 400);

                speakText("もういちど やってみよう！");

                setTimeout(() => {
                    modal.classList.add('hidden');
                    modal.classList.remove('flex');
                    isProcessing = false;
                }, 1000);
            }
        }

        function completeCurrentRow() {
            completedRows.add(currentRowKey);
            localStorage.setItem('hiragana_completed_rows', JSON.stringify(Array.from(completedRows)));

            AudioEngine.playFanfare();
            triggerConfetti();

            const rowData = GOJUON_DATA[currentRowKey];
            document.getElementById('resultSummary').textContent = `「${rowData.name}」の ひらがなを マスター したよ！ 💮`;

            const resultScreen = document.getElementById('resultScreen');
            resultScreen.classList.remove('hidden');
            resultScreen.classList.add('flex');

            speakText(`よく できました！ ${rowData.name}の ひらがなを ぜんぶ クリア したよ！`);
        }

        function restartCurrentRow() {
            document.getElementById('resultScreen').classList.add('hidden');
            document.getElementById('resultScreen').classList.remove('flex');
            startRow(currentRowKey);
        }

        function nextRow() {
            const keys = Object.keys(GOJUON_DATA);
            const idx = keys.indexOf(currentRowKey);
            document.getElementById('resultScreen').classList.add('hidden');
            document.getElementById('resultScreen').classList.remove('flex');

            if (idx >= 0 && idx < keys.length - 1) {
                startRow(keys[idx + 1]);
            } else {
                showRowSelectScreen();
            }
        }

        // Initialization
        window.onload = function() {
            showRowSelectScreen();
        };
    </script>
</body>
</html>
